<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트 예시 — 서고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14111c; --panel:#1f1a2b; --text:#efe6d2; --muted:#9c90b0; --line:#3a3150; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text);
         font-family: "Malgun Gothic", system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; margin-bottom:28px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .cap { font-size:12px; color:var(--muted); margin-top:8px; }
  .mix { position:relative; width:fit-content; }
  .mix span { position:absolute; left:0; right:0; text-align:center; font-family:"Klee One",serif; font-weight:600; color:#1b1626; line-height:1; }
  .palette { display:flex; flex-wrap:wrap; gap:6px; }
  .sw { width:34px; text-align:center; font-size:10px; color:var(--muted); }
  .sw i { display:block; width:34px; height:22px; border-radius:3px; border:1px solid #0006; margin-bottom:2px; }
</style>
</head>
<body>
<h1>⛩️ 서고 도트 예시</h1>
<p class="sub">원본 해상도로 그린 뒤 정수배로 확대 (가장자리를 흐리게 하지 않음)</p>

<div class="row" id="sprites"></div>
<div class="row"><div class="card"><h2>서고 장면 목업 (640×360 화면의 일부, 3배 확대)</h2><div id="scene"></div></div></div>
<div class="row"><div class="card"><h2>글자 크기별 가독성 (원본 픽셀)</h2><div id="sizes" class="row" style="margin:0"></div></div></div>
<div class="row"><div class="card"><h2>언령 팔레트 (초안)</h2><div id="pal" class="palette"></div></div></div>

<script>
// ── 팔레트 ─────────────────────────────────────────────
const PAL = {
  K:['#1b1626','먹(외곽선)'], H:['#2e2640','머리'],
  S:['#f6cfa6','피부'],       s:['#d9a07a','피부 그림자'],
  L:['#fffaf0','한지 밝음'],  W:['#f0e2c0','한지'], w:['#d6c08e','한지 그림자'], v:['#b39a68','한지 어둠'],
  R:['#d8432e','주홍'],       r:['#8f2a20','주홍 어둠'],
  G:['#f0b84a','금'],         g:['#b9802a','금 어둠'],
  B:['#8a5530','나무'],       b:['#b9773f','나무 밝음'], d:['#5a3420','나무 어둠'],
  N:['#3b4f8f','남색'],       n:['#26335f','남색 어둠'],
  x:['rgba(0,0,0,0.28)','그림자'],
};

// ── 스프라이트 (문자 = 팔레트 키, '.' = 투명) ──────────────
const PLAYER = [
  "................",
  ".....KKKKKK.....",
  "....KHHHHHHK....",
  "...KHHHHHHHHK...",
  "...KHHHHHHHHK...",
  "...KHSSHHSSHK...",
  "...KHSSSSSSHK...",
  "...KHSKSSKSHK...",
  "...KHSKSSKSHK...",
  "....KsSSSSsK....",
  "...KLLLRRLLLK...",
  "..KSKLLLLLLKSK..",
  "..KKKRRRRRRKKK..",
  "...KRRRrrRRRK...",
  "...KRRK..KRRK...",
  "....KK....KK....",
];

const SCROLL_CLOSED = [
  "......................",
  "...KKKKKKKKKKKKKKKK...",
  "...KLLLLLRRRRLLLLLK...",
  "KKKKWWWWWRRRRWWWWWKKKK",
  "KbBKWWWWWRRRRWWWWWKBbK",
  "KbBKWWWWWRGGRWWWWWKBbK",
  "KbBKwwwwwRGGRwwwwwKBbK",
  "KbBKwwwwwrRRrwwwwwKBbK",
  "KKKKwwwwwrrrrwwwwwKKKK",
  "...KvvvvvrrrrvvvvvK...",
  "...KKKKKKKKKKKKKKKK...",
  "....xxxxxxxxxxxxxx....",
];

// ── 그리기 도구 ───────────────────────────────────────
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(ctx, x, y, key) { if (key === '.' || !PAL[key]) return; ctx.fillStyle = PAL[key][0]; ctx.fillRect(x, y, 1, 1); }
function rect(ctx, x, y, w, h, key) { ctx.fillStyle = PAL[key][0]; ctx.fillRect(x, y, w, h); }
function blit(ctx, grid, ox, oy) { grid.forEach((row, y) => [...row].forEach((k, x) => px(ctx, ox + x, oy + y, k))); }
function scaled(src, s) { const c = mk(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0);
  c.style.width = src.width * s + 'px'; c.style.height = src.height * s + 'px'; return c; }

// 폰트 글자를 1비트 픽셀로 변환 (알파 임계값)
function glyph(ch, size, font) {
  const c = mk(size + 4, size + 4), g = c.getContext('2d');
  g.font = `${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#000'; g.fillText(ch, c.width / 2, c.height / 2 + 1);
  const d = g.getImageData(0, 0, c.width, c.height).data, pts = [];
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++)
    if (d[(y * c.width + x) * 4 + 3] > 110) pts.push([x, y]);
  return { w: c.width, h: c.height, pts };
}
const JP_FONT = "'MS Gothic','Yu Gothic','Malgun Gothic',sans-serif";

// 펼쳐진 족자(두루마리) + 글자
function openScroll(ch, drawGlyph = true) {
  const W = 30, H = 44, c = mk(W, H), g = c.getContext('2d');
  // 위 축
  rect(g, 0, 1, W, 4, 'K'); rect(g, 1, 2, W - 2, 2, 'B'); rect(g, 1, 2, W - 2, 1, 'b');
  rect(g, 0, 1, 2, 4, 'd'); rect(g, W - 2, 1, 2, 4, 'd');
  rect(g, 13, 0, 4, 1, 'R');                       // 걸이 끈
  // 표구(남색 테두리) + 한지
  rect(g, 3, 5, 24, 33, 'K'); rect(g, 4, 5, 22, 32, 'n'); rect(g, 5, 5, 20, 31, 'N');
  rect(g, 6, 7, 18, 27, 'W'); rect(g, 6, 7, 1, 27, 'L'); rect(g, 6, 33, 18, 1, 'w');
  // 글자 (먹)
  if (drawGlyph) {
  const gl = glyph(ch, 18, JP_FONT), ox = 6 + Math.floor((18 - gl.w) / 2), oy = 8 + Math.floor((20 - gl.h) / 2);
  gl.pts.forEach(([x, y]) => px(g, ox + x, oy + y, 'K'));
  }
  // 낙관(붉은 도장)
  rect(g, 19, 28, 3, 3, 'R'); px(g, 20, 29, 'r');
  // 아래 축
  rect(g, 1, 37, W - 2, 4, 'K'); rect(g, 2, 38, W - 4, 2, 'B'); rect(g, 2, 38, W - 4, 1, 'b');
  rect(g, 0, 37, 3, 4, 'd'); rect(g, W - 3, 37, 3, 4, 'd');
  rect(g, 3, 42, W - 6, 1, 'x');
  return c;
}

function spriteCanvas(grid) { const c = mk(grid[0].length, grid.length); blit(c.getContext('2d'), grid, 0, 0); return c; }

// ── 스프라이트 카드 ───────────────────────────────────
const S = document.getElementById('sprites');
[
  ['언령사 (플레이어)', spriteCanvas(PLAYER), 8, '16×16'],
  ['봉인된 두루마리', spriteCanvas(SCROLL_CLOSED), 8, '22×12'],
  ['펼쳐진 두루마리 — 전부 도트', openScroll('あ'), 6, '30×44'],
].forEach(([title, cv, s, size]) => {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>${title}</h2>`; card.appendChild(scaled(cv, s));
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = `원본 ${size}px · ${s}배 확대`;
  card.appendChild(cap); S.appendChild(card);
});


// ── 혼합 방식: 도트 두루마리 + 고해상도 교과서체 글자 ──
(function mixed() {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<h2>✅ 혼합 방식 — 도트 + 고해상도 글자</h2>';
  const wrap = document.createElement('div'); wrap.className = 'mix';
  wrap.appendChild(scaled(openScroll('あ', false), 6));
  const t = document.createElement('span'); t.textContent = 'あ';
  t.style.top = (11 * 6) + 'px'; t.style.fontSize = (15 * 6) + 'px';
  wrap.appendChild(t); card.appendChild(wrap);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = '두루마리는 도트, 글자는 Klee One(교과서체)';
  card.appendChild(cap); S.appendChild(card);
})();

// ── 장면 목업 ─────────────────────────────────────────
(function scene() {
  const W = 200, H = 112, c = mk(W, H), g = c.getContext('2d');
  // 뒷벽 + 책장
  rect(g, 0, 0, W, 46, 'n');
  for (let i = 0; i < 6; i++) {
    const x = 6 + i * 32; rect(g, x, 6, 28, 34, 'd'); rect(g, x + 1, 7, 26, 32, 'K');
    for (let s = 0; s < 3; s++) {
      rect(g, x + 1, 17 + s * 11, 26, 1, 'B');
      for (let k = 0; k < 5; k++) { const kx = x + 3 + k * 5; rect(g, kx, 9 + s * 11, 3, 8, (k + s + i) % 3 ? 'w' : 'v'); rect(g, kx, 12 + s * 11, 3, 1, 'r'); }
    }
  }
  rect(g, 0, 44, W, 2, 'K');
  // 마루
  rect(g, 0, 46, W, H - 46, 'B');
  for (let y = 46; y < H; y += 6) rect(g, 0, y, W, 1, 'd');
  for (let y = 46, o = 0; y < H; y += 6, o = (o + 23) % 40) for (let x = o; x < W; x += 40) rect(g, x, y, 1, 6, 'd');
  for (let y = 47; y < H; y += 6) rect(g, 0, y, W, 1, 'b');
  // 두루마리 받침대 4개 + 봉인된 두루마리
  const sx = [14, 54, 124, 164];
  sx.forEach(x => {
    rect(g, x - 2, 70, 26, 3, 'K'); rect(g, x - 1, 70, 24, 2, 'r'); rect(g, x, 73, 2, 6, 'K'); rect(g, x + 20, 73, 2, 6, 'K');
    rect(g, x - 1, 79, 26, 1, 'x');
    blit(g, SCROLL_CLOSED.slice(0, 11), x, 59);
  });
  // 가운데: 펼쳐진 あ 두루마리 (빛)
  g.fillStyle = 'rgba(240,184,74,0.18)'; g.fillRect(80, 22, 40, 56);
  g.fillStyle = 'rgba(240,184,74,0.12)'; g.fillRect(76, 26, 48, 48);
  g.drawImage(openScroll('あ'), 85, 26);
  [[78, 30], [121, 40], [82, 70], [118, 66], [100, 20]].forEach(([x, y]) => { px(g, x, y, 'G'); px(g, x + 1, y, 'g'); });
  // 플레이어
  rect(g, 93, 103, 14, 2, 'x');
  blit(g, PLAYER, 92, 89);
  document.getElementById('scene').appendChild(scaled(c, 3));
})();

// ── 글자 크기 비교 ────────────────────────────────────
const SZ = document.getElementById('sizes');
[10, 12, 16, 24].forEach(size => {
  const gl = glyph('あ', size, JP_FONT), c = mk(gl.w, gl.h), g = c.getContext('2d');
  rect(g, 0, 0, gl.w, gl.h, 'W'); gl.pts.forEach(([x, y]) => px(g, x, y, 'K'));
  const wrap = document.createElement('div'); wrap.style.textAlign = 'center';
  wrap.appendChild(scaled(c, 6));
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = `${size}px`; wrap.appendChild(cap);
  SZ.appendChild(wrap);
});

// ── 팔레트 표시 ───────────────────────────────────────
const P = document.getElementById('pal');
Object.entries(PAL).forEach(([k, [col, name]]) => {
  const d = document.createElement('div'); d.className = 'sw';
  d.innerHTML = `<i style="background:${col}"></i>${name}`; P.appendChild(d);
});
</script>
</body>
</html>
